<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-label="claude-catalog">
  <title>claude-catalog</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#27272a"/>
      <stop offset="100%" stop-color="#18181b"/>
    </linearGradient>
    <linearGradient id="bar" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#f59e0b"/>
    </linearGradient>
  </defs>

  <rect width="512" height="512" rx="96" fill="url(#bg)"/>

  <!-- Left amber edge accent (matches the in-app brand mark ▍) -->
  <rect x="80" y="128" width="20" height="256" rx="6" fill="url(#bar)"/>

  <!-- Three horizontal catalog bars, descending lengths -->
  <rect x="128" y="148" width="288" height="44" rx="10" fill="url(#bar)"/>
  <rect x="128" y="234" width="288" height="44" rx="10" fill="url(#bar)" opacity="0.78"/>
  <rect x="128" y="320" width="200" height="44" rx="10" fill="url(#bar)" opacity="0.55"/>

  <!-- Subtle sparkline tick row, referencing the in-app usage sparkline -->
  <path d="M128 396 L172 384 L208 392 L248 372 L296 388 L344 376 L416 384"
        fill="none" stroke="#f59e0b" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" opacity="0.55"/>
</svg>
